<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>导航大全</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  background: #1a1a2e;
  overflow-y: auto;
  overflow-x: hidden;
  user-select: none;
}

/* 自定义滚动条 */
body::-webkit-scrollbar { width: 8px; }
body::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); border-radius: 4px; }
body::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.22);
  border-radius: 4px;
  transition: background 0.2s;
}
body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) rgba(0,0,0,0.15); }

#bg {
  position: fixed; inset: 0;
  background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80') center/cover no-repeat;
  filter: blur(25px);
  -webkit-filter: blur(25px);
  transform: scale(1.1);
  z-index: 0; transition: background-image 0.5s;
}
#bg-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 30px;
  padding: 10px 5px;
}

.back-btn {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  color: rgba(255,255,255,0.93);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.18s, transform 0.15s;
}
.back-btn:hover {
  background: rgba(255,255,255,0.32);
  transform: translateY(-2px);
}

.reset-btn {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 6px 12px;
  color: rgba(255,255,255,0.8);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.18s, transform 0.15s;
  flex-shrink: 0;
}
.reset-btn:hover {
  background: rgba(220,80,80,0.45);
  border-color: rgba(220,80,80,0.6);
  transform: translateY(-2px);
}

.header-title {
  color: rgba(255,255,255,0.95);
  font-size: 20px;
  font-weight: 600;
}

/* 快速导航 - 重新设计 */
.quick-nav {
  display: flex;
  gap: 8px;
  margin-bottom: 25px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);
  align-items: center;
}
.quick-nav-label {
  font-size: 11px; color: rgba(255,255,255,0.85); flex-shrink: 0;
  letter-spacing: 0.5px; font-weight: 400;
  writing-mode: vertical-lr;
  text-align: center;
  line-height: 1.6;
  padding: 4px 0;
}
.quick-nav-btns {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-content: flex-start;
}
.quick-nav-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 6px 0;
  width: 88px;
  color: rgba(255,255,255,0.78);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  letter-spacing: 0.3px;
  overflow: hidden;
  position: relative;
  white-space: nowrap;
}
.quick-nav-btn span {
  display: inline-block;
  animation: none;
  padding: 0 2px;
}
.quick-nav-btn:hover span {
  animation: marquee 4s linear infinite;
}
@keyframes marquee {
  0% { transform: translateX(0); }
  20% { transform: translateX(0); }
  80% { transform: translateX(calc(-100% + 76px)); }
  100% { transform: translateX(calc(-100% + 76px)); }
}
.quick-nav-btn::before {
  content: '';
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(74,144,226,0.5);
  flex-shrink: 0;
}
.quick-nav-btn:hover {
  background: rgba(74,144,226,0.2);
  border-color: rgba(74,144,226,0.35);
  color: white;
  transform: translateY(-1px);
}

.nav-section { margin-bottom: 35px; }

.section-title {
  font-size: 15px;
  font-weight: 600;
  color: rgba(255,255,255,0.95);
  margin-bottom: 18px;
  padding: 8px 5px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  transition: background 0.2s;
}
.section-title:hover {
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
}
.section-title .icon { font-size: 18px; }
.section-title .count {
  font-size: 11px;
  background: rgba(74,144,226,0.3);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: normal;
}
.section-title .arrow {
  margin-left: auto;
  transition: transform 0.3s;
  font-size: 12px;
  opacity: 0.6;
}
.section-title.collapsed .arrow {
  transform: rotate(-90deg);
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 14px;
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease;
}
.nav-grid.collapsed {
  max-height: 0 !important;
  opacity: 0;
  margin: 0;
  padding: 0;
}

.nav-card {
  display: block;
  text-align: center;
  padding: 12px 6px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  color: rgba(255,255,255,0.93);
  font-size: clamp(11px, 1.8vw, 14.5px);
  text-decoration: none;
  transition: background 0.18s, transform 0.15s;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-card:hover {
  background: rgba(255,255,255,0.32);
  transform: translateY(-2px);
}

/* 右键菜单 */
.context-menu {
  position: fixed;
  background: rgba(35,35,55,0.97);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px;
  padding: 6px;
  z-index: 10000;
  min-width: 170px;
  display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
.context-menu-item {
  padding: 9px 15px;
  color: rgba(255,255,255,0.9);
  font-size: 13px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.context-menu-item:hover {
  background: rgba(74,144,226,0.4);
}

/* 编辑弹窗 */
.edit-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 20000;
  display: none;
  align-items: center;
  justify-content: center;
}
.edit-modal.show {
  display: flex;
}
.edit-modal-content {
  background: rgba(40,40,62,0.98);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 18px;
  padding: 28px 26px;
  min-width: 320px;
  max-width: 92vw;
  box-shadow: 0 12px 48px rgba(0,0,0,0.45);
}
.edit-modal-content h3 {
  color: rgba(255,255,255,0.95);
  margin-bottom: 20px;
  font-size: 17px;
  font-weight: 600;
}
.edit-modal-content input {
  width: 100%;
  padding: 11px 14px;
  margin-bottom: 14px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  color: white;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.edit-modal-content input:focus {
  border-color: rgba(74,144,226,0.7);
}
.edit-modal-content input::placeholder {
  color: rgba(255,255,255,0.35);
}
.edit-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 10px;
}
.btn-save {
  background: rgba(74,144,226,0.8);
  color: white;
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.18s;
}
.btn-save:hover { background: rgba(74,144,226,1); }
.btn-cancel {
  background: rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.8);
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.18s;
}
.btn-cancel:hover { background: rgba(255,255,255,0.22); }

@media (max-width: 768px) {
  .container { padding: 15px 20px; }
  .nav-grid {
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 10px;
  }
  .nav-card { padding: 12px 6px 10px; }
  .quick-nav { gap: 6px; padding: 10px 12px; }
  .quick-nav-btn { width: 72px; padding: 5px 0; font-size: 11px; }
  .quick-nav-btns { gap: 5px; }
}

/* 回到顶部 */
.go-top {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.85);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  transition: background 0.2s, transform 0.2s;
}
.go-top:hover {
  background: rgba(74,144,226,0.5);
  border-color: rgba(74,144,226,0.6);
  transform: translateY(-2px);
}
@media (max-width: 768px) {
  .go-top { bottom: 20px; right: 20px; width: 36px; height: 36px; font-size: 16px; }
}
</style>
</head>

  </div>
</div>

</div>

<button class="go-top" id="goTop" title="回到顶部">↑</button>

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({_version: DATA_VERSION, data: NAV_DATA}));
  } catch(e) {}
}

function resetData() {
  if (confirm('确定恢复默认导航数据？自定义的修改将丢失。')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

var NAV_DATA = loadData();
var ctxTarget = { type: '', sectionIdx: -1, itemIdx: -1 };
var modalMode = 'edit'; // 'edit' 或 'add'

// ============ 渲染层 ============

function renderQuickNav() {
  var nav = document.getElementById('quickNav');
  var html = '<span class="quick-nav-label">跳转</span><div class="quick-nav-btns">';
  for (var i = 0; i < NAV_DATA.length; i++) {
    var sec = NAV_DATA[i];
    html += '<a class="quick-nav-btn" href="javascript:void(0)" onclick="scrollToSection(' + i + ')"><span>' +
            sec.name + '</span></a>';
  }
  html += '</div>';
  nav.innerHTML = html;
}

function renderNavContent() {
  var container = document.getElementById('nav-content');
  var html = '';
  for (var i = 0; i < NAV_DATA.length; i++) {
    var sec = NAV_DATA[i];
    html += '<div class="nav-section" data-section-idx="' + i + '">';
    html += '<div class="section-title collapsed" onclick="toggleSection(this)" oncontextmenu="showCtx(event,\'section\',' + i + ',-1)">' +
            sec.name + ' <span class="count">' + sec.items.length + '</span>' +
            '<span class="arrow">▼</span></div>';
    html += '<div class="nav-grid collapsed">';
    for (var j = 0; j < sec.items.length; j++) {
      var item = sec.items[j];
      html += '<a class="nav-card" href="' + item.url + '" target="_blank"' +
              ' oncontextmenu="showCtx(event,\'item\',' + i + ',' + j + ')">' +
              item.name + '</a>';
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

function scrollToSection(idx) {
  var el = document.querySelector('[data-section-idx="' + idx + '"]');
  if (!el) return;
  var titleEl = el.querySelector('.section-title');
  var grid = el.querySelector('.nav-grid');
  if (!titleEl || !grid) return;
  // 切换展开/折叠
  if (grid.classList.contains('collapsed')) {
    grid.classList.remove('collapsed');
    titleEl.classList.remove('collapsed');
  } else {
    grid.classList.add('collapsed');
    titleEl.classList.add('collapsed');
  }
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleSection(titleEl) {
  var grid = titleEl.nextElementSibling;
  if (grid.classList.contains('collapsed')) {
    grid.classList.remove('collapsed');
    titleEl.classList.remove('collapsed');
  } else {
    grid.classList.add('collapsed');
    titleEl.classList.add('collapsed');
  }
}

// ============ 右键菜单 ============

function showCtx(e, type, si, ii) {
  e.preventDefault();
  ctxTarget.type = type;
  ctxTarget.sectionIdx = si;
  ctxTarget.itemIdx = ii;

  var menu = document.getElementById('contextMenu');
  var x = e.clientX;
  var y = e.clientY;
  if (x + 180 > window.innerWidth) x = window.innerWidth - 190;
  if (y + 130 > window.innerHeight) y = window.innerHeight - 140;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.style.display = 'block';
}

document.addEventListener('click', function() {
  document.getElementById('contextMenu').style.display = 'none';
});

function ctxAction(action) {
  document.getElementById('contextMenu').style.display = 'none';
  if (action === 'edit') openEditModal();
  else if (action === 'add') openAddModal();
  else if (action === 'addCategory') openAddCategoryModal();
  else if (action === 'delete') doDelete();
}

// ============ 编辑/添加/删除 ============

function openEditModal() {
  modalMode = 'edit';
  var t = ctxTarget;
  document.getElementById('modalTitle').textContent = '编辑';
  document.getElementById('editUrl').style.display = t.type === 'section' ? 'none' : '';

  if (t.type === 'section') {
    document.getElementById('editName').value = NAV_DATA[t.sectionIdx].name;
    document.getElementById('editName').placeholder = '分类名称';
  } else {
    document.getElementById('editName').value = NAV_DATA[t.sectionIdx].items[t.itemIdx].name;
    document.getElementById('editUrl').value = NAV_DATA[t.sectionIdx].items[t.itemIdx].url;
    document.getElementById('editName').placeholder = '项目名称';
    document.getElementById('editUrl').placeholder = '网址（http://...）';
  }
  document.getElementById('editModal').classList.add('show');
  setTimeout(function(){ document.getElementById('editName').focus(); }, 100);
}

function openAddModal() {
  modalMode = 'add';
  var t = ctxTarget;
  document.getElementById('modalTitle').textContent = '添加项目';
  document.getElementById('editName').value = '';
  document.getElementById('editUrl').value = '';
  document.getElementById('editName').placeholder = '项目名称';
  document.getElementById('editUrl').placeholder = '网址（http://...）';
  document.getElementById('editUrl').style.display = '';
  document.getElementById('editModal').classList.add('show');
  setTimeout(function(){ document.getElementById('editName').focus(); }, 100);
}

function openAddCategoryModal() {
  modalMode = 'addCategory';
  document.getElementById('modalTitle').textContent = '添加类别';
  document.getElementById('editName').value = '';
  document.getElementById('editUrl').value = '';
  document.getElementById('editName').placeholder = '类别名称（如：🎮 游戏）';
  document.getElementById('editUrl').style.display = 'none';
  document.getElementById('editModal').classList.add('show');
  setTimeout(function(){ document.getElementById('editName').focus(); }, 100);
}

function modalSave() {
  if (modalMode === 'edit') {
    saveEdit();
  } else if (modalMode === 'addCategory') {
    saveAddCategory();
  } else {
    saveAdd();
  }
}

function saveEdit() {
  var t = ctxTarget;
  var name = document.getElementById('editName').value.trim();
  if (!name) { alert('名称不能为空'); return; }

  if (t.type === 'section') {
    NAV_DATA[t.sectionIdx].name = name;
  } else {
    var url = document.getElementById('editUrl').value.trim();
    if (!url) { alert('网址不能为空'); return; }
    NAV_DATA[t.sectionIdx].items[t.itemIdx].name = name;
    NAV_DATA[t.sectionIdx].items[t.itemIdx].url = url;
  }
  closeEditModal();
  saveData();
  renderQuickNav();
  renderNavContent();
}

function saveAdd() {
  var t = ctxTarget;
  var name = document.getElementById('editName').value.trim();
  var url = document.getElementById('editUrl').value.trim();
  if (!name) { alert('名称不能为空'); return; }
  if (!url) { alert('网址不能为空'); return; }

  if (t.type === 'section') {
    NAV_DATA[t.sectionIdx].items.push({ name: name, url: url });
  } else {
    NAV_DATA[t.sectionIdx].items.splice(t.itemIdx + 1, 0, { name: name, url: url });
  }
  closeEditModal();
  saveData();
  renderQuickNav();
  renderNavContent();
}

function saveAddCategory() {
  var name = document.getElementById('editName').value.trim();
  if (!name) { alert('类别名称不能为空'); return; }
  
  NAV_DATA.push({ name: name, items: [] });
  closeEditModal();
  saveData();
  renderQuickNav();
  renderNavContent();
}

function doDelete() {
  if (!confirm('确定要删除吗？')) return;
  var t = ctxTarget;
  if (t.type === 'section') {
    NAV_DATA.splice(t.sectionIdx, 1);
  } else {
    NAV_DATA[t.sectionIdx].items.splice(t.itemIdx, 1);
  }
  saveData();
  renderQuickNav();
  renderNavContent();
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
}

// ============ 背景同步 ============

function syncBg() {
  try {
    var s = localStorage.getItem('app-settings');
    if (s) {
      var settings = JSON.parse(s);
      if (settings.bg) {
        document.getElementById('bg').style.backgroundImage = 'url(' + settings.bg + ')';
      }
      if (settings.overlay !== undefined) {
        document.getElementById('bg-overlay').style.background = 'rgba(0,0,0,' + (settings.overlay/100) + ')';
      }
    }
  } catch(e) {}
}

function goBack() {
  window.location.href = 'index.html';
}

// ============ 初始化 ============
(function() {
  syncBg();
  renderQuickNav();
  renderNavContent();

  // 回到顶部
  var goTop = document.getElementById('goTop');
  if (goTop) {
    goTop.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
})();
</script>
